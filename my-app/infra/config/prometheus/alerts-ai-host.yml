groups:
  - name: compliancetool-ai-host
    rules:
      - alert: RequiredTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "A required AI-host metrics target is unavailable"
      - alert: NvidiaGpuMemoryPressure
        expr: DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 0.95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU framebuffer memory use has exceeded 95%"
      - alert: NvidiaGpuTemperatureHigh
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "GPU temperature has exceeded 85 C"
      - alert: WireGuardPeerStale
        expr: node_time_seconds - wireguard_latest_handshake_seconds > 180
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The application-host WireGuard peer is stale"
