global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts-ai-host.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: dcgm
    static_configs:
      - targets: [dcgm-exporter:9400]
  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: [litellm:4000]
  - job_name: vllm-chat
    metrics_path: /metrics
    static_configs:
      - targets: [vllm-chat:8000]
  - job_name: vllm-embedding
    metrics_path: /metrics
    static_configs:
      - targets: [vllm-embedding:8000]
