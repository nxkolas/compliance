model_list:
  - model_name: compliance-chat
    litellm_params:
      model: openai/compliance-chat
      api_base: http://vllm-chat:8000/v1
      api_key: local-vllm
      timeout: 120
  - model_name: compliance-embedding
    litellm_params:
      model: openai/compliance-embedding
      api_base: http://vllm-embedding:8000/v1
      api_key: local-vllm
      timeout: 120

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 0
  timeout: 120

litellm_settings:
  drop_params: true
  request_timeout: 120
  set_verbose: false
  telemetry: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  custom_auth: custom_auth.user_api_key_auth
  disable_spend_logs: true
