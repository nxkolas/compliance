services:
  vllm-chat:
    networks: [inference, observability]

  vllm-embedding:
    networks: [inference, observability]

  litellm:
    networks: [inference, wireguard, observability]

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - ${AI_DATA_ROOT}/metrics:/var/lib/node_exporter/textfile_collector:ro
    networks: [observability]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  dcgm-exporter:
    image: ${DCGM_EXPORTER_IMAGE}
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES}
      NVIDIA_DRIVER_CAPABILITIES: utility
    networks: [observability]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ../../config/prometheus/ai-host.yml:/etc/prometheus/prometheus.yml:ro
      - ../../config/prometheus/alerts-ai-host.yml:/etc/prometheus/alerts-ai-host.yml:ro
      - ${AI_DATA_ROOT}/prometheus:/prometheus
    depends_on: [node-exporter, dcgm-exporter, alertmanager]
    networks: [inference, observability]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  alertmanager:
    image: ${ALERTMANAGER_IMAGE}
    restart: unless-stopped
    command: [--config.file=/etc/alertmanager/alertmanager.yml]
    volumes:
      - ../../config/alertmanager/production.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERTMANAGER_WEBHOOK_FILE}:/run/secrets/alertmanager_webhook_url:ro
    networks: [observability]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  loki:
    image: ${LOKI_IMAGE}
    restart: unless-stopped
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ../../config/loki/loki.yml:/etc/loki/loki.yml:ro
      - ${AI_DATA_ROOT}/loki:/loki
    networks: [observability]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  alloy:
    image: ${ALLOY_IMAGE}
    restart: unless-stopped
    command: [run, /etc/alloy/config.alloy]
    volumes:
      - ../../config/alloy/local.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on: [loki]
    networks: [observability]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  grafana:
    image: ${GRAFANA_IMAGE}
    restart: unless-stopped
    ports:
      - 127.0.0.1:3001:3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${DASHBOARD_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD: ${DASHBOARD_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${AI_DATA_ROOT}/grafana:/var/lib/grafana
      - ../../config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus, loki]
    networks: [observability]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  observability:
    internal: true
