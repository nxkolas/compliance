name: ${AI_PROJECT_NAME}

x-ai-security: &ai-security
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=4g
  pids_limit: 2048

x-offline: &offline
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE}
  TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE}
  HF_DATASETS_OFFLINE: "1"
  VLLM_NO_USAGE_STATS: "1"
  DO_NOT_TRACK: "1"
  NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES}
  NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES}

services:
  vllm-chat:
    <<: *ai-security
    image: ${VLLM_IMAGE}
    restart: unless-stopped
    command:
      - --model
      - /models/chat
      - --served-model-name
      - ${CHAT_MODEL_ALIAS}
      - --max-model-len
      - ${CHAT_MAX_MODEL_LEN}
      - --max-num-seqs
      - ${CHAT_MAX_NUM_SEQS}
      - --gpu-memory-utilization
      - ${CHAT_GPU_MEMORY_UTILIZATION}
      - --reasoning-parser
      - qwen3
      - --disable-log-requests
    environment:
      <<: *offline
    volumes:
      - ${CHAT_MODEL_PATH}:/models/chat:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s
    networks: [inference]
    ipc: private
    shm_size: 16gb
    mem_limit: 96g
    cpus: 12
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  vllm-embedding:
    <<: *ai-security
    image: ${VLLM_IMAGE}
    restart: unless-stopped
    command:
      - --model
      - /models/embedding
      - --served-model-name
      - ${EMBEDDING_MODEL_ALIAS}
      - --task
      - embed
      - --max-model-len
      - ${EMBEDDING_MAX_MODEL_LEN}
      - --gpu-memory-utilization
      - ${EMBEDDING_GPU_MEMORY_UTILIZATION}
      - --disable-log-requests
    environment:
      <<: *offline
    volumes:
      - ${EMBEDDING_MODEL_PATH}:/models/embedding:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s
    networks: [inference]
    ipc: private
    shm_size: 8gb
    mem_limit: 32g
    cpus: 4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  litellm:
    image: ${LITELLM_IMAGE}
    restart: unless-stopped
    depends_on:
      vllm-chat:
        condition: service_healthy
      vllm-embedding:
        condition: service_healthy
    command: [--config, /etc/litellm/config.yaml, --port, "4000", --num_workers, "1"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_APPLICATION_KEY: ${LITELLM_APPLICATION_KEY}
      PYTHONPATH: /etc/litellm
    volumes:
      - ../../config/litellm/production.yaml:/etc/litellm/config.yaml:ro
      - ../../config/litellm/custom_auth.py:/etc/litellm/custom_auth.py:ro
    ports:
      - ${WIREGUARD_BIND_ADDRESS}:4000:4000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [inference, wireguard]
    mem_limit: 4g
    cpus: 4
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  inference:
    internal: true
  wireguard:
    internal: true
