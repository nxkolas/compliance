name: ${PLATFORM_PROJECT_NAME}

services:
  db:
    image: ${COMPLIANCETOOL_DB_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
      WALG_S3_PREFIX: ${WALG_S3_PREFIX}
      WALG_COMPRESSION_METHOD: zstd
      WALG_UPLOAD_CONCURRENCY: "4"
      AWS_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      AWS_REGION: ${BACKUP_REGION}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY}
      AWS_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=warning
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=900
      - -c
      - archive_command=/usr/local/bin/wal-g wal-push %p
    volumes:
      - ${APP_DATA_ROOT}/postgres/data:/var/lib/postgresql/data
      - ${APP_DATA_ROOT}/postgres/config:/etc/postgresql-custom
      - ../../vendor/supabase/volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ../../vendor/supabase/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ../../vendor/supabase/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ../../vendor/supabase/volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ../../config/supabase/db-init/00-vector.sql:/docker-entrypoint-initdb.d/migrations/96-vector.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [data, egress]
    shm_size: 512mb
    mem_limit: 10g
    cpus: 4
    pids_limit: 1024
    security_opt: [no-new-privileges:true]

  auth:
    image: ${SUPABASE_AUTH_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_KEYS: ${JWT_KEYS}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:9999/health]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data, egress]
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    security_opt: [no-new-privileges:true]

  rest:
    image: ${SUPABASE_REST_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_JWKS}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    security_opt: [no-new-privileges:true]

  storage:
    image: ${COMPLIANCETOOL_STORAGE_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_healthy
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      JWT_JWKS: ${JWT_JWKS}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: "57671680"
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      GLOBAL_S3_ENDPOINT: ${GLOBAL_S3_ENDPOINT}
      GLOBAL_S3_PROTOCOL: ${GLOBAL_S3_PROTOCOL}
      GLOBAL_S3_FORCE_PATH_STYLE: ${GLOBAL_S3_FORCE_PATH_STYLE}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      TENANT_ID: ${STORAGE_TENANT_ID}
      REGION: ${REGION}
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://storage:5000/status]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [data, egress]
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    security_opt: [no-new-privileges:true]

  kong:
    image: ${KONG_IMAGE}
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: "1"
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,request-termination,post-function
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC}
    volumes:
      - ../../config/kong/kong.yml.template:/home/kong/temp.yml:ro
      - ../../vendor/supabase/volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
    entrypoint: [/bin/sh, /home/kong/kong-entrypoint.sh]
    healthcheck:
      test: [CMD, kong, health]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [edge, data]
    mem_limit: 1g
    cpus: 1
    pids_limit: 512
    security_opt: [no-new-privileges:true]

  docling:
    image: ${DOCLING_IMAGE}
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [app]
    mem_limit: 8g
    cpus: 4
    pids_limit: 1024
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      SUPABASE_DOMAIN: ${SUPABASE_DOMAIN}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ../../config/caddy/Caddyfile.app-host:/etc/caddy/Caddyfile:ro
      - ${CADDY_ACTIVE_UPSTREAM_FILE}:/etc/caddy/active-upstream.caddy:ro
      - ${APP_DATA_ROOT}/caddy/data:/data
      - ${APP_DATA_ROOT}/caddy/config:/config
      - ${APP_DATA_ROOT}/caddy/logs:/var/log/caddy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [edge, observability]
    mem_limit: 512m
    cpus: 2
    pids_limit: 256

networks:
  edge:
    name: ${EDGE_NETWORK_NAME}
  app:
    name: ${APP_NETWORK_NAME}
    internal: true
  data:
    name: ${DATA_NETWORK_NAME}
    internal: true
  egress:
    name: ${EGRESS_NETWORK_NAME}
  observability:
    name: ${OBSERVABILITY_NETWORK_NAME}
