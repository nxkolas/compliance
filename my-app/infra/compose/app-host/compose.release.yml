name: ${RELEASE_PROJECT_NAME}

x-app-security: &app-security
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  pids_limit: 256

x-web: &web
  <<: *app-security
  image: ${WEB_IMAGE}
  env_file: ["${APP_ENV_FILE}"]
  restart: unless-stopped
  networks: [edge, app, data]
  mem_limit: 4g
  cpus: 3
  stop_grace_period: 30s

x-worker: &worker
  <<: *app-security
  image: ${WORKER_IMAGE}
  env_file: ["${APP_ENV_FILE}"]
  restart: unless-stopped
  networks: [edge, app, data]
  mem_limit: 6g
  cpus: 4
  stop_grace_period: 5m

services:
  web-blue:
    <<: *web
    profiles: [blue]

  web-green:
    <<: *web
    profiles: [green]

  worker-blue:
    <<: *worker
    profiles: [blue]
    environment:
      WORKER_ID: ${APP_ENV}-blue

  worker-green:
    <<: *worker
    profiles: [green]
    environment:
      WORKER_ID: ${APP_ENV}-green

  database-bootstrap:
    <<: *app-security
    image: ${WORKER_IMAGE}
    env_file: ["${APP_ENV_FILE}"]
    restart: "no"
    command: [node, node_modules/tsx/dist/cli.mjs, scripts/bootstrap-disposable-schema.ts]
    networks: [data]
    mem_limit: 1g
    cpus: 1

  supabase-bootstrap:
    <<: *app-security
    image: ${WORKER_IMAGE}
    env_file: ["${APP_ENV_FILE}"]
    restart: "no"
    command: [node, node_modules/tsx/dist/cli.mjs, scripts/bootstrap-storage.ts]
    networks: [edge, data]
    mem_limit: 1g
    cpus: 1

networks:
  edge:
    name: ${EDGE_NETWORK_NAME}
    external: true
  app:
    name: ${APP_NETWORK_NAME}
    external: true
  data:
    name: ${DATA_NETWORK_NAME}
    external: true
