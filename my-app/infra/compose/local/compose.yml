name: ${COMPOSE_PROJECT_NAME:-compliancetool-local}

x-app-security: &app-security
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  pids_limit: 256

x-app-environment: &app-environment
  env_file:
    - ${COMPLIANCE_ENV_FILE:-../../../.env.docker.local}

services:
  db:
    image: ${COMPLIANCETOOL_DB_IMAGE}
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: database
      args:
        SUPABASE_DB_BASE_IMAGE: ${SUPABASE_DB_BASE_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=warning
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      - ../../vendor/supabase/volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ../../vendor/supabase/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ../../vendor/supabase/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ../../vendor/supabase/volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ../../config/supabase/db-init/00-vector.sql:/docker-entrypoint-initdb.d/migrations/96-vector.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [data]
    shm_size: 256mb
    mem_limit: 4g
    cpus: 3
    pids_limit: 512
    security_opt:
      - no-new-privileges:true

  auth:
    image: ${SUPABASE_AUTH_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_KEYS: ${JWT_KEYS}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:9999/health]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  rest:
    image: ${SUPABASE_REST_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_JWKS}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: [postgrest]
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  rustfs:
    image: ${RUSTFS_IMAGE}
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_REGION: ${REGION}
      RUSTFS_OBS_LOGGER_LEVEL: info
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: [CMD, sh, -c, curl -f http://127.0.0.1:9000/health]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [data]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  rustfs-init:
    <<: *app-security
    image: ${COMPLIANCETOOL_WORKER_IMAGE}
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: worker
      args:
        VCS_REF: ${COMPLIANCETOOL_REVISION}
        SOURCE_URL: ${COMPLIANCETOOL_SOURCE}
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    command:
      - node
      - node_modules/tsx/dist/cli.mjs
      - scripts/s3-operator.ts
      - ensure-bucket
      - ${GLOBAL_S3_BUCKET}
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${REGION}
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
    networks: [data]

  storage:
    image: ${COMPLIANCETOOL_STORAGE_IMAGE}
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: storage
      args:
        SUPABASE_STORAGE_BASE_IMAGE: ${SUPABASE_STORAGE_BASE_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      JWT_JWKS: ${JWT_JWKS}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: "57671680"
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      GLOBAL_S3_ENDPOINT: ${GLOBAL_S3_ENDPOINT}
      GLOBAL_S3_PROTOCOL: ${GLOBAL_S3_PROTOCOL}
      GLOBAL_S3_FORCE_PATH_STYLE: ${GLOBAL_S3_FORCE_PATH_STYLE}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      TENANT_ID: ${STORAGE_TENANT_ID}
      REGION: ${REGION}
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://storage:5000/status]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [data]
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  kong:
    image: ${KONG_IMAGE}
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: "1"
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,request-termination,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC}
    volumes:
      - ../../config/kong/kong.yml.template:/home/kong/temp.yml:ro
      - ../../vendor/supabase/volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
    entrypoint: [/bin/sh, /home/kong/kong-entrypoint.sh]
    healthcheck:
      test: [CMD, kong, health]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [edge, data]
    mem_limit: 1g
    cpus: 1
    pids_limit: 512
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: ${MAILPIT_IMAGE}
    restart: unless-stopped
    ports:
      - 127.0.0.1:8025:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ${OLLAMA_IMAGE}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [app]
    mem_limit: 12g
    cpus: 12
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true

  ollama-model-init:
    image: ${OLLAMA_IMAGE}
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        ollama pull "$${OLLAMA_CHAT_MODEL}"
        ollama pull "$${OLLAMA_EMBEDDING_MODEL}"
    networks: [app]
    security_opt:
      - no-new-privileges:true

  litellm:
    image: ${LITELLM_IMAGE}
    restart: unless-stopped
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    command: [--config, /etc/litellm/config.yaml, --port, "4000", --num_workers, "1"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ../../config/litellm/local.yaml:/etc/litellm/config.yaml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [app]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: [*app-security, *app-environment]
    image: ${COMPLIANCETOOL_WORKER_IMAGE}
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: worker
      args:
        VCS_REF: ${COMPLIANCETOOL_REVISION}
        SOURCE_URL: ${COMPLIANCETOOL_SOURCE}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    command: [node, node_modules/tsx/dist/cli.mjs, scripts/migrate.ts]
    networks: [data]
    mem_limit: 1g
    cpus: 1

  supabase-bootstrap:
    <<: [*app-security, *app-environment]
    image: ${COMPLIANCETOOL_WORKER_IMAGE}
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kong:
        condition: service_healthy
    command: [node, node_modules/tsx/dist/cli.mjs, scripts/bootstrap-storage.ts]
    networks: [edge, data]
    mem_limit: 1g
    cpus: 1

  worker:
    <<: [*app-security, *app-environment]
    image: ${COMPLIANCETOOL_WORKER_IMAGE}
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: worker
      args:
        VCS_REF: ${COMPLIANCETOOL_REVISION}
        SOURCE_URL: ${COMPLIANCETOOL_SOURCE}
    restart: unless-stopped
    depends_on:
      supabase-bootstrap:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    networks: [app, edge, data]
    mem_limit: 4g
    cpus: 4
    stop_grace_period: 5m

  web:
    <<: [*app-security, *app-environment]
    image: ${COMPLIANCETOOL_WEB_IMAGE}
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: web
      args:
        VCS_REF: ${COMPLIANCETOOL_REVISION}
        SOURCE_URL: ${COMPLIANCETOOL_SOURCE}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    restart: unless-stopped
    depends_on:
      supabase-bootstrap:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    networks: [edge, app, data]
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s

  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      kong:
        condition: service_healthy
    ports:
      - 127.0.0.1:3000:3000
      - 127.0.0.1:8000:8000
    volumes:
      - ../../config/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config:rw,noexec,nosuid,size=16m
      - /data:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks: [edge]
    mem_limit: 256m
    cpus: 1
    pids_limit: 128

networks:
  edge:
  app:
  data:
    internal: true

volumes:
  db-data:
  db-config:
  rustfs-data:
  ollama-data:
