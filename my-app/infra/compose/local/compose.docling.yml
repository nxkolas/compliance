services:
  docling:
    image: ${DOCLING_IMAGE}
    profiles: [docling]
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [app]
    mem_limit: 6g
    cpus: 4
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true
