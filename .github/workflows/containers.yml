name: Publish containers

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-containers-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      web-image: ${{ steps.manifest.outputs.web-image }}
      worker-image: ${{ steps.manifest.outputs.worker-image }}
      database-image: ${{ steps.manifest.outputs.database-image }}
      storage-image: ${{ steps.manifest.outputs.storage-image }}
      studio-image: ${{ steps.manifest.outputs.studio-image }}
      postgres-meta-image: ${{ steps.manifest.outputs.postgres-meta-image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: web
        name: Build and publish web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: my-app
          target: web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/compliancetool-web:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - id: worker
        name: Build and publish worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: my-app
          target: worker
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/compliancetool-worker:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - id: storage
        name: Build and publish hardened Storage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: my-app
          target: storage
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/compliancetool-storage:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - id: database
        name: Build and publish WAL-G-enabled database
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: my-app
          target: database
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/compliancetool-database:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - id: studio
        name: Build and publish hardened Studio
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: my-app
          target: studio
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/compliancetool-studio:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - id: postgres_meta
        name: Build and publish hardened postgres-meta
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: my-app
          target: postgres-meta
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/compliancetool-postgres-meta:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign immutable images
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/compliancetool-web@${{ steps.web.outputs.digest }}
          WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/compliancetool-worker@${{ steps.worker.outputs.digest }}
          DATABASE_IMAGE: ghcr.io/${{ github.repository_owner }}/compliancetool-database@${{ steps.database.outputs.digest }}
          STORAGE_IMAGE: ghcr.io/${{ github.repository_owner }}/compliancetool-storage@${{ steps.storage.outputs.digest }}
          STUDIO_IMAGE: ghcr.io/${{ github.repository_owner }}/compliancetool-studio@${{ steps.studio.outputs.digest }}
          META_IMAGE: ghcr.io/${{ github.repository_owner }}/compliancetool-postgres-meta@${{ steps.postgres_meta.outputs.digest }}
        run: |
          cosign sign --yes "$WEB_IMAGE"
          cosign sign --yes "$WORKER_IMAGE"
          cosign sign --yes "$DATABASE_IMAGE"
          cosign sign --yes "$STORAGE_IMAGE"
          cosign sign --yes "$STUDIO_IMAGE"
          cosign sign --yes "$META_IMAGE"
      - name: Scan published web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/compliancetool-web@${{ steps.web.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan published worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/compliancetool-worker@${{ steps.worker.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan published hardened Storage image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/compliancetool-storage@${{ steps.storage.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan published WAL-G-enabled database image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/compliancetool-database@${{ steps.database.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan published hardened Studio image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/compliancetool-studio@${{ steps.studio.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan published hardened postgres-meta image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/compliancetool-postgres-meta@${{ steps.postgres_meta.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - id: manifest
        name: Create deployment manifest and bundle
        working-directory: my-app
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/compliancetool-web@${{ steps.web.outputs.digest }}
          WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/compliancetool-worker@${{ steps.worker.outputs.digest }}
          DATABASE_IMAGE: ghcr.io/${{ github.repository_owner }}/compliancetool-database@${{ steps.database.outputs.digest }}
          STORAGE_IMAGE: ghcr.io/${{ github.repository_owner }}/compliancetool-storage@${{ steps.storage.outputs.digest }}
          STUDIO_IMAGE: ghcr.io/${{ github.repository_owner }}/compliancetool-studio@${{ steps.studio.outputs.digest }}
          META_IMAGE: ghcr.io/${{ github.repository_owner }}/compliancetool-postgres-meta@${{ steps.postgres_meta.outputs.digest }}
        run: |
          printf 'RELEASE_REVISION=%s\nWEB_IMAGE=%s\nWORKER_IMAGE=%s\nCOMPLIANCETOOL_DB_IMAGE=%s\nCOMPLIANCETOOL_STORAGE_IMAGE=%s\nCOMPLIANCETOOL_STUDIO_IMAGE=%s\nCOMPLIANCETOOL_META_IMAGE=%s\n' \
            "$GITHUB_SHA" "$WEB_IMAGE" "$WORKER_IMAGE" "$DATABASE_IMAGE" "$STORAGE_IMAGE" "$STUDIO_IMAGE" "$META_IMAGE" > release-manifest.env
          tar -czf deployment-bundle.tgz infra
          sha256sum release-manifest.env deployment-bundle.tgz > SHA256SUMS
          {
            echo "web-image=$WEB_IMAGE"
            echo "worker-image=$WORKER_IMAGE"
            echo "database-image=$DATABASE_IMAGE"
            echo "storage-image=$STORAGE_IMAGE"
            echo "studio-image=$STUDIO_IMAGE"
            echo "postgres-meta-image=$META_IMAGE"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-${{ github.sha }}
          path: |
            my-app/release-manifest.env
            my-app/deployment-bundle.tgz
            my-app/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
