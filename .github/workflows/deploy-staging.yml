name: Deploy staging

on:
  workflow_run:
    workflows:
      - Publish containers
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deployment-${{ github.event.workflow_run.head_sha }}
          path: deployment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify release bundle
        working-directory: deployment
        run: sha256sum --check SHA256SUMS
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and deploy immutable release
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          RELEASE_ROOT: ${{ secrets.STAGING_RELEASE_ROOT }}
          ENVIRONMENT_FILE: ${{ secrets.STAGING_ENVIRONMENT_FILE }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          remote_archive="deployment-${REVISION}.tgz"
          remote_manifest="release-${REVISION}.env"
          scp deployment/deployment-bundle.tgz "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"
          scp deployment/release-manifest.env "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_manifest}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- \
            "$RELEASE_ROOT" "$REVISION" "$remote_archive" "$remote_manifest" "$ENVIRONMENT_FILE" <<'REMOTE'
          set -euo pipefail
          release_root="$1"
          revision="$2"
          archive="$3"
          manifest="$4"
          environment_file="$5"
          source_root="${release_root}/source-${revision}"
          sudo -n install -d -o 0 -g 0 -m 0750 "$source_root"
          sudo -n tar -xzf "$archive" -C "$source_root"
          sudo -n "$source_root/infra/scripts/deploy-from-manifest.sh" "$manifest" "$environment_file"
          rm -f "$archive" "$manifest"
          REMOTE
